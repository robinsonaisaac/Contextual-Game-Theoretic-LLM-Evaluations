[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "game_theory_llm"
version = "0.1.0"
description = "Contextual game-theoretic LLM evaluation framework"
requires-python = ">=3.9"
dependencies = [
    "openai",
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "scipy>=1.7.0",
    "statsmodels>=0.13.0",
    "networkx",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]
ml = [
    "xgboost",
    "scikit-learn",
    "sentence-transformers",
]
steering = [
    "torch>=2.5,<3",
    "transformers>=4.46",
    "accelerate>=1.0",
    "huggingface_hub",
    "pyarrow>=14",
    "modal>=0.66",
]

[tool.setuptools.packages.find]
include = ["game_theory_llm*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
